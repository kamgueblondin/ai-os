# AI-OS CI — build, unit tests, QEMU smoke boot
# Default branch is master (main is listed so a rename would still work).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-test:
    name: Build, tests, QEMU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            libc6-dev-i386 \
            nasm \
            qemu-system-x86

      - name: Build OS image
        run: make all

      - name: Verify build artifacts
        run: |
          test -s build/ai_os.bin
          test -s my_initrd.tar
          ls -lh build/ai_os.bin my_initrd.tar
          file build/ai_os.bin

      - name: Run unit tests (make test-all)
        run: make test-all

      - name: QEMU smoke (sendkey ls/cat/ps/uptime/mem/getpid/whoami on serial)
        run: make qemu-smoke

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          if-no-files-found: ignore
          path: |
            test_logs/
            ci-serial.log
